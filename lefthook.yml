# Installed by `make tools`. Pre-commit checks staged files only; pre-push
# runs the tests. Tools are the pinned copies in ./bin, which hooks can't
# expect on PATH.
pre-commit:
  parallel: true
  jobs:
    - name: go
      root: backend/
      glob: "*.go"
      run: ../bin/golangci-lint fmt --diff && ../bin/golangci-lint run --new-from-rev=HEAD
    - name: squawk
      glob: "db/migrations/*.up.sql"
      run: bin/squawk {staged_files}
    - name: sqlfluff
      glob: "db/migrations/*.sql"
      run: uvx sqlfluff==4.4.0 lint {staged_files}
    - name: shell
      glob: "scripts/*"
      run: bin/shellcheck {staged_files} && bin/shfmt -d {staged_files}
    - name: prettier
      glob: "*.{ts,tsx,js,json,css,md,yml,yaml,html}"
      run: frontend/node_modules/.bin/prettier --check --ignore-unknown {staged_files}
    - name: frontend
      root: frontend/
      glob: "*.{ts,tsx}"
      run: node_modules/.bin/oxlint --type-aware --deny-warnings --no-error-on-unmatched-pattern {staged_files} && node_modules/.bin/tsc -b
    - name: gitleaks
      run: bin/gitleaks git --pre-commit --staged --no-banner --redact .

pre-push:
  jobs:
    - name: test
      run: make test
