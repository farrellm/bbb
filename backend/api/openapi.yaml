openapi: 3.1.0
info:
  title: Pingry BBB Watch API
  version: "1"
  description: >
    The JSON API under /api. Everything except the auth routes, the VAPID
    key and the health check needs a session cookie. The frontend's types are generated
    from this file (frontend/src/api/schema.d.ts); the Go shapes live in
    backend/internal/handler/types.go. Change them together.
servers:
  - url: /api

paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Up, and the database answers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: The database doesn't answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /auth/google/start:
    get:
      operationId: googleStart
      summary: Begin Google sign-in (a browser navigation, not a fetch).
      parameters:
        - { name: invite, in: query, schema: { type: string } }
        - { name: handoff, in: query, schema: { type: string } }
        - { name: next, in: query, schema: { type: string } }
      responses:
        "302": { description: To Google. }
        "503": { $ref: "#/components/responses/Error" }

  /auth/google/callback:
    get:
      operationId: googleCallback
      summary: >
        Google redirects here. On success it redirects to `next` (or
        /signed-in for a handoff); on failure to /login or /join with
        ?error= one of expired, cancelled, email_unverified, failed,
        handoff_expired, invite_required, invite_invalid.
      responses:
        "302": { description: Back into the app. }

  /auth/handoff:
    post:
      operationId: createHandoff
      summary: Start an iOS home-screen sign-in handoff.
      responses:
        "200":
          description: The nonce to pass to /auth/google/start and poll.
          content:
            application/json:
              schema:
                type: object
                required: [nonce]
                properties:
                  nonce: { type: string }

  /auth/handoff/{nonce}:
    get:
      operationId: claimHandoff
      parameters:
        - { name: nonce, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Signed in; sets the session cookie. Single use.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "202":
          description: Sign-in not finished yet.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: pending }
        "404": { $ref: "#/components/responses/Error" }

  /auth/invites/{code}:
    get:
      operationId: checkInvite
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Whether the invite can still create an account.
          content:
            application/json:
              schema:
                type: object
                required: [usable]
                properties:
                  usable: { type: boolean }

  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Signed out. }

  /me:
    get:
      operationId: me
      summary: The signed-in user. Also renews the session cookie.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }

  /status:
    get:
      operationId: status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Error" }

  /items:
    get:
      operationId: listItems
      summary: Current items in page order.
      parameters:
        - name: division
          in: query
          schema: { $ref: "#/components/schemas/Division" }
        - name: signup
          in: query
          description: 1 for signup items only.
          schema: { type: string, enum: ["0", "1"] }
        - name: include_removed
          in: query
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /items/{panelID}:
    get:
      operationId: getItem
      parameters:
        - {
            name: panelID,
            in: path,
            required: true,
            schema: { type: integer, format: int64 },
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /items/{panelID}/versions/{versionID}:
    get:
      operationId: getVersion
      parameters:
        - {
            name: panelID,
            in: path,
            required: true,
            schema: { type: integer, format: int64 },
          }
        - {
            name: versionID,
            in: path,
            required: true,
            schema: { type: integer, format: int64 },
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /events:
    get:
      operationId: listEvents
      summary: The timeline, newest first.
      parameters:
        - name: before
          in: query
          description: An event id; returns older events.
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /events/read:
    post:
      operationId: markRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              additionalProperties: false
              properties:
                ids:
                  type: array
                  maxItems: 1000
                  items: { type: integer, format: int64 }
      responses:
        "204": { description: Marked. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /preferences:
    get:
      operationId: getPreferences
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      operationId: putPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "200":
          description: Saved; divisions come back in page order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /push/vapid-public-key:
    get:
      operationId: vapidPublicKey
      summary: The applicationServerKey browsers subscribe with.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key:
                    description: Base64url, uncompressed P-256 point.
                    type: string
        "503": { $ref: "#/components/responses/Error" }

  /push/subscribe:
    post:
      operationId: subscribe
      summary: >
        Save this device's subscription. An endpoint already saved (say, for
        whoever signed in on the device before) moves to this user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionIn" }
      responses:
        "201":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      operationId: unsubscribe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              additionalProperties: false
              properties:
                endpoint: { type: string }
      responses:
        "204": { description: "Removed, or never saved." }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /push/devices:
    get:
      operationId: listDevices
      responses:
        "200":
          description: Oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Error" }

  /push/devices/{id}:
    delete:
      operationId: deleteDevice
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: integer, format: int64 },
          }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /push/test:
    post:
      operationId: testPush
      summary: Push a test notification to each of the user's devices.
      responses:
        "200":
          description: >
            How many devices accepted it. Devices the push service says are
            gone are removed.
          content:
            application/json:
              schema:
                type: object
                required: [sent, failed]
                properties:
                  sent: { type: integer }
                  failed: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /admin/invites:
    get:
      operationId: listInvites
      responses:
        "200":
          description: Invite links that can still admit a parent, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                maxUses: { type: integer, minimum: 1, maximum: 100, default: 1 }
                expiresInDays:
                  type: integer
                  minimum: 0
                  maximum: 365
                  default: 14
                  description: 0 for an invite that never expires.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/invites/{code}:
    delete:
      operationId: revokeInvite
      summary: Expire an invite link now. Parents who joined with it keep their accounts.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Expired. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/scrape-runs:
    get:
      operationId: listScrapeRuns
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScrapeRun" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

components:
  responses:
    Error:
      description: An error with a message fit to show.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Division:
      type: string
      enum: [all, lower, middle, upper]

    EventKind:
      type: string
      enum: [new, edit, moved, removed]

    User:
      type: object
      required: [id, email, name, pictureUrl, isAdmin]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        name: { type: string }
        pictureUrl: { type: string }
        isAdmin: { type: boolean }

    Status:
      type: object
      required: [checkedAt, okAt, failing, unread]
      properties:
        checkedAt:
          description: When the last poll finished, whatever its outcome.
          type: [string, "null"]
          format: date-time
        okAt:
          description: When the last successful poll finished.
          type: [string, "null"]
          format: date-time
        failing:
          description: The last poll failed or looked wrong.
          type: boolean
        unread:
          description: Items the feed marks unread, for the app badge.
          type: integer

    Event:
      type: object
      required:
        [
          id,
          panelId,
          kind,
          createdAt,
          fromVersionId,
          toVersionId,
          repostOf,
          becameSignup,
          wordsAdded,
          wordsRemoved,
          unread,
        ]
      properties:
        id: { type: integer, format: int64 }
        panelId: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/EventKind" }
        createdAt: { type: string, format: date-time }
        fromVersionId: { type: [integer, "null"], format: int64 }
        toVersionId: { type: [integer, "null"], format: int64 }
        repostOf:
          description: Panel id of a recently removed item with the same title.
          type: [integer, "null"]
          format: int64
        becameSignup: { type: boolean }
        wordsAdded: { type: integer }
        wordsRemoved: { type: integer }
        unread: { type: boolean }

    TimelineEvent:
      allOf:
        - $ref: "#/components/schemas/Event"
        - type: object
          required: [division, title, isSignup]
          properties:
            division: { $ref: "#/components/schemas/Division" }
            title: { type: string }
            isSignup: { type: boolean }

    SignupLink:
      type: object
      required: [url, label, text]
      properties:
        url: { type: string }
        label:
          description: Short tab label, e.g. "Sign up", "RSVP", "Buy tickets".
          type: string
        text:
          description: The link's own text in the item body.
          type: string

    Item:
      type: object
      required:
        [
          panelId,
          division,
          position,
          versionId,
          versionCount,
          title,
          subheader,
          bodyHtml,
          isSignup,
          signupLinks,
          deadline,
          firstSeenAt,
          lastSeenAt,
          removedAt,
          latestEvent,
        ]
      properties:
        panelId: { type: integer, format: int64 }
        division: { $ref: "#/components/schemas/Division" }
        position: { type: integer }
        versionId: { type: integer, format: int64 }
        versionCount: { type: integer }
        title: { type: string }
        subheader: { type: string }
        bodyHtml:
          description: Sanitized; safe for innerHTML.
          type: string
        isSignup: { type: boolean }
        signupLinks:
          type: array
          items: { $ref: "#/components/schemas/SignupLink" }
        deadline: { type: [string, "null"], format: date }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        removedAt: { type: [string, "null"], format: date-time }
        latestEvent:
          description: The newest new, edit or removed event.
          oneOf:
            - $ref: "#/components/schemas/Event"
            - type: "null"

    ItemList:
      type: object
      required: [items, lastReadAt]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        lastReadAt:
          description: When the user last marked anything read.
          type: [string, "null"]
          format: date-time

    VersionMeta:
      type: object
      required: [id, seenAt, title]
      properties:
        id: { type: integer, format: int64 }
        seenAt: { type: string, format: date-time }
        title: { type: string }

    ItemDetail:
      type: object
      required: [item, versions, events]
      properties:
        item: { $ref: "#/components/schemas/Item" }
        versions:
          description: Oldest first.
          type: array
          items: { $ref: "#/components/schemas/VersionMeta" }
        events:
          description: Newest first.
          type: array
          items: { $ref: "#/components/schemas/TimelineEvent" }

    Version:
      type: object
      required:
        [id, panelId, seenAt, title, subheader, bodyText, bodyHtml, signupLinks]
      properties:
        id: { type: integer, format: int64 }
        panelId: { type: integer, format: int64 }
        seenAt: { type: string, format: date-time }
        title: { type: string }
        subheader: { type: string }
        bodyText:
          description: The normalized text that diffs compare.
          type: string
        bodyHtml: { type: string }
        signupLinks:
          type: array
          items: { $ref: "#/components/schemas/SignupLink" }

    EventPage:
      type: object
      required: [events, nextBefore]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/TimelineEvent" }
        nextBefore:
          description: Pass as `before` for the next page; null at the end.
          type: [integer, "null"]
          format: int64

    Invite:
      type: object
      required: [code, url, maxUses, uses, expiresAt, createdAt]
      properties:
        code: { type: string }
        url: { type: string }
        maxUses: { type: integer }
        uses: { type: integer, description: Parents who have joined with it. }
        expiresAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    ScrapeRun:
      type: object
      required:
        [
          id,
          startedAt,
          finishedAt,
          httpStatus,
          unchanged,
          itemCount,
          suspect,
          error,
        ]
      properties:
        id: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        httpStatus: { type: [integer, "null"] }
        unchanged: { type: boolean }
        itemCount: { type: [integer, "null"] }
        suspect: { type: boolean }
        error: { type: [string, "null"] }

    Preferences:
      type: object
      required:
        [
          divisions,
          notifyNew,
          notifyEdit,
          notifyRemoved,
          signupsOnly,
          signupsAnyDivision,
          minEditWords,
          quietStart,
          quietEnd,
        ]
      additionalProperties: false
      properties:
        divisions:
          description: Divisions whose items notify.
          type: array
          items: { $ref: "#/components/schemas/Division" }
        notifyNew: { type: boolean }
        notifyEdit: { type: boolean }
        notifyRemoved: { type: boolean }
        signupsOnly:
          description: Only signup items notify.
          type: boolean
        signupsAnyDivision:
          description: Signup items notify whatever their division.
          type: boolean
        minEditWords:
          description: >
            The smallest edit, in words added plus removed, that notifies.
            An edit that adds a signup link always does.
          type: integer
          minimum: 0
          maximum: 1000
        quietStart:
          description: >
            Start of quiet hours, "HH:MM" in the school's time zone; null
            when there are none. Set with quietEnd, which must differ.
            Notifications due in quiet hours are held, then sent as one
            when they end.
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        quietEnd:
          description: End of quiet hours; may be earlier than quietStart to cross midnight.
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"

    SubscriptionIn:
      description: What PushSubscription.toJSON() gives, less expirationTime.
      type: object
      required: [endpoint, keys]
      additionalProperties: false
      properties:
        endpoint:
          description: An https URL on a known push service.
          type: string
          maxLength: 2048
        keys:
          type: object
          required: [p256dh, auth]
          additionalProperties: false
          properties:
            p256dh: { type: string }
            auth: { type: string }

    Device:
      type: object
      required: [id, endpoint, userAgent, createdAt, lastOkAt]
      properties:
        id: { type: integer, format: int64 }
        endpoint: { type: string }
        userAgent:
          description: The browser that subscribed, to name the device.
          type: string
        createdAt: { type: string, format: date-time }
        lastOkAt:
          description: When a push to it last succeeded.
          type: [string, "null"]
          format: date-time

    PushPayload:
      description: >
        Not an API response: the JSON inside each push, which the service
        worker shows. Here so its type is shared.
      type: object
      required: [title, body, url, tag, badge]
      properties:
        title: { type: string }
        body: { type: string }
        url:
          description: The app path a tap opens.
          type: string
        tag:
          description: A later notification with the same tag replaces this one.
          type: string
        badge:
          description: The user's unread count, for the app icon.
          type: integer
